<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<style>
  .button {

    font-family: 'Times New Roman', Times, serif;
    text-align: left;
    padding-top: 6px;
    padding-bottom: 6px;
    font-size: medium;
    background-color: #fae104;
    display: flexbox;
    border-radius: 15px;
    border: none;
    float: right;
    cursor: pointer;
    margin-right: 14px;
    font-weight: bold;
    text-decoration: none;
    height: auto;
    transition: all 0.3s ease;
    width: auto;

  }

  .submit-button {
    background-color: #faf604;
    color: black;
    border-radius: 20px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    font-family: 'Times New Roman', Times, serif;
    transition: background-color 0.3s ease;
    border: none;
    float: center;
    display: flex;
    flex: auto;
  }

  .span-1 {
    display: flex;
    flex-direction: column;
    gap: 10px;
    row-gap: 10px;
    color: #0474f5;


  }

  .submit-button :hover {
    background-color: #ab01ee;
  }






  .description {
    font-size: 16px;
    margin-bottom: 20px;
    color: #0445f7;
  }

  .footer {
    background-color: #f1f1f1;
    padding: 20px;
    text-align: center;
    color: #0474f5;
    display: flex;
    float: center;

  }

  .map {
    width: 100%;
    height: 300px;
    border: none;
  }

  .header {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #0474f5;
    align-items: center;
  }

  form {
    background-image: url(images/best.jpg);
    background-repeat: no-repeat;
    background-position: center;
  }

  .button:hover {
    background-color: #b404fa;
    opacity: 3;
  }

  iframe {
    display: block;
    margin: 0 auto;
  }







</style>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Kids Corner</title>
  <link rel="icon" href="images/Colorful Kids Corner Logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <img src="images/Colorful Kids Corner Logo.png" alt="" width="48" height="48">
      <span>Kids Corner</span>
    </div>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="About us.html">About us</a>
      <a href="Contact Us.html">Contact us</a>
      
    </nav>
  </header>
  <main>
    <div class="container">
      
        <h1 class="Header">Talk to us</h1>
        <p class="Description">We would love to hear from you! Please feel free to reach out to us with any questions or
          feedback.</p>
        <br>
        <form id="contact-form">
          <span class="span-1">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="phone">Phone:</label>
            <input type="text" id="number" name="number" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
          </span>
          <br>
          <input type="submit" value="Submit" class="submit-button">
        </form>
        <p id="form-status" role="status" aria-live="polite"></p>
      </div>
      <br> 
    
    <br>


    <h2 class="Header">Our Location</h2>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d63003.13158914819!2d35.2405671!3d-0.3666017!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x182a59f951013d67%3A0x301b52d71be9c462!2sKericho%20Teachers%20Training%20College!5e1!3m2!1sen!2ske!4v1793708302079!5m2!1sen!2ske"
      width="700" height="300" style="border:0;" allowfullscreen="" loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin" class="Map">

    </iframe>

    <br>
    <section>

      <footer class="footer">
        <nav>
          <Ul class="Link">
            <li><a href="https://www.youtube.com/">Facebook</a></li>
          <li><a href="https://www.youtube.com/">Tiktok</a></li>
          <li><a href="https://www.youtube.com/">Youtube</a></li>
          </Ul>
        </nav>

        <p>@ 2026 Tales of Joy Published</p>
      </footer>
    </section>


  </main>
  <script src="script.js"></script>
  
</body>
</html>
